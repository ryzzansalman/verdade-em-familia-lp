<svg viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#012c56"/>
      <stop offset="1" stop-color="#021f3d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#feb302"/>
      <stop offset="1" stop-color="#f59e00"/>
    </linearGradient>
    <filter id="sh3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#feb302" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="288" height="588" rx="38" fill="url(#bg3)" stroke="#0a3a66" stroke-width="3"/>
  <rect x="118" y="20" width="64" height="9" rx="4.5" fill="#0a3a66"/>
  <text x="150" y="70" text-anchor="middle" fill="#feb302" font-size="20" font-weight="700">⭐ Premium</text>
  <text x="150" y="96" text-anchor="middle" fill="#cfe0f0" font-size="11">Centenas de perguntas liberadas</text>
  <!-- free card -->
  <rect x="34" y="120" width="232" height="78" rx="20" fill="#0a3a66"/>
  <text x="52" y="150" fill="#fff" font-size="14" font-weight="700">Gratuito</text>
  <text x="52" y="174" fill="#7fa8d0" font-size="11">10 perguntas genéricas</text>
  <text x="240" y="166" text-anchor="end" fill="#36c9b0" font-size="16" font-weight="700">R$0</text>
  <!-- annual card (highlight) -->
  <rect x="30" y="214" width="240" height="124" rx="22" fill="url(#gold)" filter="url(#sh3)"/>
  <rect x="180" y="200" width="86" height="24" rx="12" fill="#fd4a43"/>
  <text x="223" y="216" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">MAIS POPULAR</text>
  <text x="52" y="248" fill="#012c56" font-size="15" font-weight="700">Bienal</text>
  <text x="52" y="268" fill="#012c56" font-size="13" opacity="0.5" text-decoration="line-through">R$180</text>
  <text x="52" y="298" fill="#012c56" font-size="28" font-weight="800">R$100</text>
  <text x="165" y="298" fill="#012c56" font-size="11" opacity="0.8">/2 anos · R$7,50/mês</text>
  <rect x="52" y="308" width="192" height="18" rx="9" fill="#012c56" opacity="0.18"/>
  <text x="148" y="321" text-anchor="middle" fill="#012c56" font-size="9" font-weight="700">PROMOÇÃO ESPECIAL DE LANÇAMENTO</text>
  <!-- monthly card -->
  <rect x="34" y="356" width="232" height="78" rx="20" fill="#0a3a66"/>
  <text x="52" y="386" fill="#fff" font-size="14" font-weight="700">Mensal</text>
  <text x="52" y="410" fill="#7fa8d0" font-size="11">Acesso total flexível</text>
  <text x="240" y="400" text-anchor="end" fill="#feb302" font-size="18" font-weight="700">R$35</text>
  <!-- benefits -->
  <g font-size="11" fill="#cfe0f0">
    <text x="40" y="468">✓ Centenas de perguntas por ator</text>
    <text x="40" y="490">✓ Atualizações automáticas</text>
    <text x="40" y="512">✓ Sem repetição até esgotar o banco</text>
  </g>
  <!-- cta -->
  <rect x="40" y="532" width="220" height="56" rx="28" fill="#fd4a43"/>
  <text x="150" y="567" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Assinar agora</text>
</svg>
