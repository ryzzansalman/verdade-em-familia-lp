<svg viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#012c56"/>
      <stop offset="1" stop-color="#021f3d"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#feb302"/>
      <stop offset="1" stop-color="#f59e00"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- phone frame -->
  <rect x="6" y="6" width="288" height="588" rx="38" fill="url(#bg1)" stroke="#0a3a66" stroke-width="3"/>
  <rect x="118" y="20" width="64" height="9" rx="4.5" fill="#0a3a66"/>
  <!-- header -->
  <text x="150" y="74" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">Verdade em Família</text>
  <rect x="60" y="86" width="180" height="3" rx="1.5" fill="#fd4a43"/>
  <!-- spinner card -->
  <circle cx="150" cy="210" r="78" fill="none" stroke="#0a3a66" stroke-width="10"/>
  <circle cx="150" cy="210" r="78" fill="none" stroke="#fd4a43" stroke-width="10" stroke-linecap="round" stroke-dasharray="245 245" stroke-dashoffset="60" transform="rotate(-90 150 210)"/>
  <!-- avatar inside -->
  <circle cx="150" cy="195" r="26" fill="url(#card1)"/>
  <circle cx="150" cy="184" r="11" fill="#012c56"/>
  <path d="M132 212 q18 -20 36 0" fill="#012c56"/>
  <text x="150" y="248" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">FILHA</text>
  <text x="150" y="266" text-anchor="middle" fill="#7fa8d0" font-size="10">sorteada da vez</text>
  <!-- prompt -->
  <text x="150" y="320" text-anchor="middle" fill="#feb302" font-size="11" font-weight="600" letter-spacing="1">PERGUNTA PARA OS PAIS</text>
  <!-- big button -->
  <rect x="45" y="345" width="210" height="62" rx="31" fill="#fd4a43" filter="url(#sh)"/>
  <text x="150" y="383" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">SORTEAR 🎲</text>
  <!-- chips -->
  <g font-size="10" font-weight="600">
    <rect x="40" y="430" width="60" height="26" rx="13" fill="#0a3a66"/>
    <text x="70" y="447" text-anchor="middle" fill="#cfe0f0">Pai</text>
    <rect x="106" y="430" width="60" height="26" rx="13" fill="#0a3a66"/>
    <text x="136" y="447" text-anchor="middle" fill="#cfe0f0">Mãe</text>
    <rect x="172" y="430" width="88" height="26" rx="13" fill="#0a3a66"/>
    <text x="216" y="447" text-anchor="middle" fill="#cfe0f0">Responsável</text>
    <rect x="62" y="464" width="74" height="26" rx="13" fill="#fd4a43" opacity="0.9"/>
    <text x="99" y="481" text-anchor="middle" fill="#fff">Filho</text>
    <rect x="142" y="464" width="74" height="26" rx="13" fill="#feb302"/>
    <text x="179" y="481" text-anchor="middle" fill="#012c56">Filha</text>
  </g>
  <!-- progress -->
  <text x="40" y="528" fill="#7fa8d0" font-size="10">Perguntas restantes</text>
  <rect x="40" y="536" width="220" height="8" rx="4" fill="#0a3a66"/>
  <rect x="40" y="536" width="150" height="8" rx="4" fill="#36c9b0"/>
  <!-- nav -->
  <line x1="20" y1="560" x2="280" y2="560" stroke="#0a3a66" stroke-width="1.5"/>
  <text x="75" y="582" text-anchor="middle" font-size="16">🎲</text>
  <text x="150" y="582" text-anchor="middle" font-size="16" opacity="0.5">👨‍👩‍👧</text>
  <text x="225" y="582" text-anchor="middle" font-size="16" opacity="0.5">⚙️</text>
</svg>
